<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Древа Симнации</title>
<script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t)})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root,:root[data-theme="light"]{
  --ink:#f6f1ea; --ink2:#fbf8f3; --card:#fbf8f3; --card-h:#fffdf9;
  --line:#e4dbcf; --line2:#d6cab9;
  --head:#2a2320; --text:#4a3f38; --muted:#7d6f64; --faint:#a3958a;
  --ember:#b5532f; --ember-h:#9c4424; --on-ember:#fbf8f3; --moss:#6b7d4f; --gold:#a8812f; --sky:#5b7f93;
  --glow:rgba(181,83,47,.08); --glow2:rgba(107,125,79,.06); --r:14px; color-scheme:light}
:root[data-theme="dark"]{
  --ink:#1b1716; --ink2:#221d1b; --card:#241f1c; --card-h:#2b2522;
  --line:#382f2b; --line2:#4a4036;
  --head:#efe6db; --text:#d9cfc4; --muted:#a3958a; --faint:#7a6e60;
  --ember:#e07a4b; --ember-h:#ea9068; --on-ember:#1b1716; --moss:#9bb07a; --gold:#d8b46a; --sky:#86a6b8;
  --glow:rgba(224,122,75,.10); --glow2:rgba(155,176,122,.07); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font:15px/1.5 Literata,Georgia,serif;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(900px 500px at 85% -10%, var(--glow), transparent 60%),
  radial-gradient(700px 500px at -10% 20%, var(--glow2), transparent 60%),
  var(--ink);min-height:100vh}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:48px 24px 80px}
header{margin-bottom:32px}
.topnav{margin-bottom:28px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-decoration:none;padding:7px 13px;border:1px solid var(--line);border-radius:999px;transition:color .15s,border-color .15s}
.back:hover{color:var(--ember);border-color:var(--ember)}
.theme-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
.theme-btn:hover{color:var(--ember);border-color:var(--ember)}

.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ember);font-weight:600}
h1{color:var(--head);font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(40px,6vw,64px);line-height:1;margin:10px 0 14px;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:680px;margin:0}
.lead b{color:var(--text);font-weight:600}

/* hero: Отты */
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin:32px 0 28px}
.hero{display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--ember) 12%,var(--card)) 0%,var(--card) 65%);border:1px solid color-mix(in srgb,var(--ember) 35%,var(--line));border-radius:20px;padding:26px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.hero .tag{color:var(--ember)}
.hero h2{color:var(--head);font-family:"Cormorant Garamond",serif;font-size:36px;font-weight:600;margin:2px 0 0;line-height:1.05}
.hero .surn{color:var(--muted);font-size:14px}
.hero .stats{margin-top:8px}
.hero .open{position:relative;z-index:1;align-self:flex-start;margin-top:auto}
.hero .stats{margin-bottom:14px}
/* controls */
.controls{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--ink) 90%,transparent);backdrop-filter:blur(10px);
  margin:0 -24px 24px;padding:14px 24px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 280px;position:relative}
.search input{width:100%;background:var(--ink2);border:1px solid var(--line2);color:var(--text);
  border-radius:10px;padding:11px 14px 11px 40px;font:inherit;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--ember)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.sort{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.sort button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:10px 14px;cursor:pointer}
.sort button[aria-pressed=true]{background:var(--card-h);color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line2);color:var(--muted);
  border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--faint);color:var(--text)}
.chip[aria-pressed=true]{color:var(--text);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip small{color:var(--faint);font-size:12px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* sections */
section{margin-top:36px}
section h3{color:var(--head);display:flex;align-items:baseline;gap:12px;font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:600;margin:0 0 4px}
section h3 span{font-family:Literata;font-size:13px;color:var(--faint);font-weight:500}
section .desc{color:var(--faint);font-size:13.5px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;
  display:flex;flex-direction:column;gap:10px;transition:border-color .15s, background .15s, transform .15s;position:relative}
.card:hover{border-color:var(--line2);background:var(--card-h)}
.card::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--c);opacity:.85}
.card h4{color:var(--head);font-family:"Cormorant Garamond",serif;font-size:23px;font-weight:600;margin:0;line-height:1.1}
.card .surn{font-size:12.5px;color:var(--faint);margin-top:3px}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.stats span{white-space:nowrap}
.stats b{color:var(--head);font-weight:600;font-variant-numeric:tabular-nums}
.path{font-size:12.5px;color:var(--muted);line-height:1.6}
.path .arr{color:var(--faint);margin:0 4px}
.path .last{color:var(--text)}
.note{font-size:12.5px;color:var(--faint);font-style:italic;border-left:1px solid var(--line2);padding-left:10px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:600;
  padding:8px 12px;border-radius:9px;border:1px solid var(--line2);color:var(--text);transition:all .15s}
.btn:hover{border-color:var(--ember);color:var(--ember)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:var(--on-ember)}
.btn.primary:hover{background:var(--ember-h);border-color:var(--ember-h);color:var(--on-ember)}
.btn svg{width:13px;height:13px}
.pending{font-size:11px;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:999px;padding:2px 8px;align-self:flex-start}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty button{margin-top:12px}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;line-height:1.7}
@media (max-width:600px){
  .wrap{padding:32px 16px 60px}
  .controls{margin:0 -16px 20px;padding:12px 16px}
  .heroes{grid-template-columns:1fr}
  .hero{padding:22px}
  .hero h2{font-size:32px}
  .controls{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

", "path": "", "note": ""}, {"id": "FAM-077", "name": "Эрсан", "group": "closely_connected_to_ott", "surn": "Эрсан", "url": "https://simsdynastytree.com/ru/public/trees/DpK9zxErqZXYgSidTXYvQ", "extra": [], "inSave": 3, "alive": 1, "gens": "2", "path": "Отт → Эрсан", "note": ""}, {"id": "FAM-078", "name": "Эфир", "group": "local_secondary", "surn": "Эфир", "url": "https://simsdynastytree.com/ru/public/trees/8P9bu7rz6CzU8HrOyGnOo", "extra": [], "inSave": 3, "alive": 3, "gens": "3", "path": "", "note": ""}, {"id": "FAM-079", "name": "Партон", "group": "local_secondary", "surn": "Партон", "url": "https://simsdynastytree.com/ru/public/trees/7sdz_zSjW4Ol_3ynpJVia", "extra": [], "inSave": 2, "alive": 2, "gens": "2", "path": "", "note": ""}, {"id": "FAM-080", "name": "Найт", "group": "local_secondary", "surn": "Найт", "url": "https://simsdynastytree.com/ru/public/trees/FmNljfICqqJXkydXbUN_Q", "extra": [], "inSave": 2, "alive": 2, "gens": "2", "path": "", "note": ""}, {"id": "FAM-081", "name": "Даркмор", "group": "influential_independent", "surn": "Даркмор", "url": "https://simsdynastytree.com/ru/public/trees/pQWQ5kDV529QLRxx2csp", "extra": [], "inSave": 5, "alive": 5, "gens": "3", "path": "", "note": ""}, {"id": "FAM-082", "name": "Сайди Броуд", "group": "local_secondary", "surn": "Сайди; Броуд; Сайди Броуд", "url": "https://simsdynastytree.com/ru/public/trees/zzaUl1RgG2QvZRh8AoIE", "extra": [], "inSave": 5, "alive": 5, "gens": "2", "path": "Отт → Прескотт → Сайди Броуд", "note": "ветвь вынесена из древа Эмбер в самостоятельное древо"}, {"id": "FAM-083", "name": "Холостякки", "group": "closely_connected_to_ott", "surn": "Холостякки", "url": "https://simsdynastytree.com/ru/public/trees/wZJbmMlge0LNHW5bVwU7", "extra": [], "inSave": 2, "alive": 2, "gens": "3", "path": "Отт → Холостякки", "note": "историческая семья; древо связано с Гот через Беллу Гот и Майкла Холостякки"}, {"id": "FAM-084", "name": "Ладипо", "group": "independent_needs_classification", "surn": "Ладипо", "url": "https://simsdynastytree.com/ru/public/trees/aFTw_yuVmjUA9wgju4ytC", "extra": [], "inSave": 1, "alive": 1, "gens": "2", "path": "", "note": ""}, {"id": "FAM-085", "name": "Кук", "group": "independent_needs_classification", "surn": "Кук", "url": "https://simsdynastytree.com/ru/public/trees/sBsPWm4ZNp7KLbg5u7d8c", "extra": [], "inSave": 3, "alive": 3, "gens": "2", "path": "", "note": ""}, {"id": "FAM-086", "name": "Сарпонг", "group": "independent_needs_classification", "surn": "Сарпонг; Хофман-Сарпонг", "url": "https://simsdynastytree.com/ru/public/trees/HYv_YYi5BNhGPWxygnzJ", "extra": [], "inSave": 3, "alive": 3, "gens": "2", "path": "", "note": ""}, {"id": "FAM-087", "name": "Корвере", "group": "independent_needs_classification", "surn": "Корвере", "url": "https://simsdynastytree.com/ru/public/trees/2VOXBRr8X5hMobnRDiuCN", "extra": [], "inSave": 2, "alive": 2, "gens": "2", "path": "", "note": ""}, {"id": "FAM-088", "name": "Трендал", "group": "independent_needs_classification", "surn": "Трендал; Андервуд", "url": "https://simsdynastytree.com/ru/public/trees/PpphZ26kTWqYaZkWs3ooW", "extra": [], "inSave": 3, "alive": 3, "gens": "2", "path": "Отт → Андервуд → Трендал", "note": "пересекается с древом Андервуд"}, {"id": "FAM-089", "name": "Шиллер", "group": "independent_needs_classification", "surn": "Шиллер", "url": "https://simsdynastytree.com/ru/public/trees/gOUWCbxZiDPMfleR0PbcR", "extra": [], "inSave": 1, "alive": 1, "gens": "2", "path": "Отт → Альто → Шиллер", "note": ""}, {"id": "FAM-090", "name": "Озман | Коша", "group": "independent_needs_classification", "surn": "Озман; Коша", "url": "https://simsdynastytree.com/ru/public/trees/VMC6W7Gtay2AoE8z6CYBE", "extra": [], "inSave": 2, "alive": 2, "gens": "1", "path": "", "note": ""}];

const GROUPS = [
  {key:'closely_connected_to_ott', title:'Ближний круг Оттов', desc:'Семьи, породнившиеся с Оттами напрямую: браки, дети, союзы.', c:'var(--ember)'},
  {key:'influential_independent', title:'Влиятельные независимые', desc:'Самостоятельные дома со своим весом в мире; к Оттам — через одно-два рукопожатия или никак.', c:'var(--gold)'},
  {key:'local_secondary', title:'Местные семьи', desc:'Соседи, городские линии, питомцы — фон, на котором держится мир.', c:'var(--moss)'},
  {key:'independent_needs_classification', title:'Новые в архиве', desc:'Свежие древа, которые ещё не нашли своё место в большой картине.', c:'var(--sky)'},
];
const GC = Object.fromEntries(GROUPS.map(g=>[g.key,g.c]));

const ext = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const esc = s => String(s??'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const plural = (n, a, b, c) => { n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; };

const ORDER=['Отт','Котики семейства Отт','Собаки семьи Отт'];
const core = DATA.filter(d=>d.group==='central').sort((a,b)=>ORDER.indexOf(a.name)-ORDER.indexOf(b.name));
const rest = DATA.filter(d=>d.group!=='central');
const totalTrees = DATA.reduce((s,d)=>s+1+d.extra.length,0);

document.getElementById('lead').innerHTML =
  `<b>${DATA.length}</b> ${plural(DATA.length,'семья','семьи','семей')} из сохранения и <b>${totalTrees}</b> ${plural(totalTrees,'древо','древа','древ')} на simsdynastytree. Карточки сгруппированы по значимости семьи; у каждой — путь родства до Оттов.`;

function stats(d){
  if(d.inSave==null) return '<span class="pending">в реестре популяции ещё не посчитана</span>';
  const p=[];
  p.push(`<span><b>${d.inSave}</b> в сохранении</span>`);
  if(d.alive!=null) p.push(`<span><b>${d.alive}</b> ${plural(d.alive,'живой','живых','живых')}</span>`);
  if(d.gens) p.push(`<span><b>${d.gens}</b> ${plural(+d.gens,'поколение','поколения','поколений')}</span>`);
  return `<div class="stats">${p.join('')}</div>`;
}
function path(d){
  if(!d.path) return '';
  const parts=d.path.split('→').map(s=>s.trim());
  return `<div class="path">${parts.map((p,i)=>`<span class="${i===parts.length-1?'last':''}">${esc(p)}</span>`).join('<span class="arr">→</span>')}</div>`;
}
function surn(d){
  const s=d.surn.split(';').map(x=>x.trim()).filter(Boolean);
  const nameParts=d.name.split('|').map(x=>x.trim());
  const others=s.filter(x=>!nameParts.includes(x));
  return others.length?`<div class="surn">также: ${esc(others.join(', '))}</div>`:'';
}
function links(d, primaryLabel='Открыть древо'){
  let h=`<a class="btn primary" href="${esc(d.url)}" target="_blank" rel="noopener">${primaryLabel} ${ext}</a>`;
  d.extra.forEach(e=>{h+=`<a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.name)} ${ext}</a>`});
  return `<div class="links">${h}</div>`;
}
function card(d){
  return `<article class="card" style="--c:${GC[d.group]}">
    <div><h4>${esc(d.name)}</h4>${surn(d)}</div>
    ${stats(d)}${path(d)}
    ${d.note?`<div class="note">${esc(d.note)}</div>`:''}
    ${links(d)}
  </article>`;
}

// hero
document.getElementById('hero').innerHTML = core.map(d=>{
  const isOtt=d.name==='Отт';
  const sv=d.surn.split(';').map(x=>x.trim()).filter(x=>x && x!=='Отт' && x!==d.name);
  return `<div class="hero">
    <div class="eyebrow tag">${isOtt?'Ядро династии':d.name.startsWith('Котики')?'Наследная линия питомцев':'Питомцы семьи'}</div>
    <h2>${isOtt?'Семейство Отт':esc(d.name)}</h2>
    ${sv.length?`<div class="surn">Ветви и фамилии: ${esc(sv.join(', '))}</div>`:''}
    ${stats(d)}
    <a class="btn primary open" href="${esc(d.url)}" target="_blank" rel="noopener">Открыть древо ${ext}</a>
  </div>`;}).join('');

// state
let active = new Set(GROUPS.map(g=>g.key)), sort='abc', q='';
try{ const s=JSON.parse(localStorage.getItem('trees-ui')||'{}'); if(s.sort) sort=s.sort; }catch(e){}
const save=()=>{try{localStorage.setItem('trees-ui',JSON.stringify({sort}))}catch(e){}};

const chips=document.getElementById('chips');
chips.innerHTML = GROUPS.map(g=>{
  const n=rest.filter(d=>d.group===g.key).length;
  return `<button class="chip" data-g="${g.key}" aria-pressed="true" style="--c:${g.c}"><i></i>${g.title} <small>${n}</small></button>`;
}).join('');
chips.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  const k=b.dataset.g;
  // first click isolates a group, later clicks toggle
  if(active.size===GROUPS.length){ active=new Set([k]); }
  else if(active.has(k)){ active.delete(k); if(!active.size) active=new Set(GROUPS.map(g=>g.key)); }
  else active.add(k);
  chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',active.has(c.dataset.g)));
  render();
});
document.querySelectorAll('.sort button').forEach(b=>{
  b.setAttribute('aria-pressed', b.dataset.sort===sort);
  b.onclick=()=>{sort=b.dataset.sort;document.querySelectorAll('.sort button').forEach(x=>x.setAttribute('aria-pressed',x===b));save();render();};
});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render();});

function render(){
  const main=document.getElementById('main');
  const match=d=>!q||[d.name,d.surn,d.path,d.note,...d.extra.map(e=>e.name)].join(' ').toLowerCase().includes(q);
  let html='', shown=0;
  for(const g of GROUPS){
    if(!active.has(g.key)) continue;
    let items=rest.filter(d=>d.group===g.key&&match(d));
    if(!items.length) continue;
    items.sort(sort==='size'?(a,b)=>(b.inSave??-1)-(a.inSave??-1)||a.name.localeCompare(b.name,'ru'):(a,b)=>a.name.localeCompare(b.name,'ru'));
    shown+=items.length;
    html+=`<section><h3>${g.title}<span>${items.length}</span></h3><p class="desc">${g.desc}</p><div class="grid">${items.map(card).join('')}</div></section>`;
  }
  main.innerHTML = shown?html:`<div class="empty">Ничего не нашлось по запросу «${esc(q)}».<br><button class="btn" id="reset">Сбросить поиск</button></div>`;
  const r=document.getElementById('reset'); if(r) r.onclick=()=>{document.getElementById('q').value='';q='';render();};
}
render();
</script>
<script>
document.querySelector('.theme-btn').addEventListener('click',function(){
  var r=document.documentElement,t=r.getAttribute('data-theme')==='dark'?'light':'dark';
  r.setAttribute('data-theme',t);try{localStorage.setItem('theme',t)}catch(e){}
});
window.addEventListener('storage',function(e){if(e.key==='theme'&&(e.newValue==='light'||e.newValue==='dark'))document.documentElement.setAttribute('data-theme',e.newValue)});
</script>
</body>
</html>
